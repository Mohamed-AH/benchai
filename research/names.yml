quotations:
  note: >
    The site quotes several sayings in Arabic (for example "خف على كرسيك من رجل واحد",
    "موعدنا الرياض", "الحكم لله ثم لعبدالعزيز بن عبدالرحمن", "ثلاثة أرماح").
    Apart from the well-known call "الحكم لله ثم لعبدالعزيز", these were translated
    back into Arabic from the English transcript, so the wording may differ from what is
    said in the episode. Please check them against the audio.
