name: Agent Evaluation Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install solari-sandbox google-genai

      - name: Run Evaluation Harness
        env:
          SOLARI_API_KEY: ${{ vars.SOLARI_API_KEY }}
          GEMINI_API_KEY: ${{ vars.GEMINI_API_KEY }}
        run: python solari_eval_harness.py

      - name: Display Benchmark Results
        run: cat benchmark_results.json

      - name: Upload Benchmark Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json
