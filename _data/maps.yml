# What each chapter's map shows. Keyed by the chapter's `ref`.
#
#   places: towns and sites to label. `facts` = the fact codes (research/facts.yml)
#           that make the place part of this chapter's story.
#   events: markers with a caption.
#             kind:  battle | siege | taken | surrender | settlement | event
#             year:  Hijri year as the chapter gives it ("" if the chapter gives none)
#             en / ar: the caption, worded like the chapter (never stronger)
#   routes: lines between places, in order. approximate: true = drawn dashed and
#           labelled approximate, because the podcast names the ends but not the path.
#
# Every item needs facts, and those facts must be cited in the chapter text.
# `python3 research/check_maps.py` checks this.
# Place positions are in places.yml.

writing-history:
  places:
    - {id: hijr-yamamah, facts: [F006]}
    - {id: diriyah, facts: [F008, F013]}

early-life:
  places:
    - {id: riyadh, facts: [F027]}
    - {id: hail, facts: [F026]}
  events:
    - {kind: battle, place: mulayda, year: "1308", facts: [F027], en: "Battle of Al-Mulayda", ar: "معركة المليداء"}
    - {kind: siege, place: riyadh, year: "1308", facts: [F027], en: "Ibn Rashid besieges Riyadh", ar: "ابن رشيد يحاصر الرياض"}

