# Places shown on the chapter maps.
#
#   en / ar:   the name as written on the site (same spelling as the chapters)
#   lat / lon: position in decimal degrees
#   source:    where the position comes from
#                geonames  = GeoNames "cities1000" data (via the all-the-cities package, v3.1.0)
#                wikipedia = coordinates printed in the English Wikipedia article
#                podcast   = placed from a description in the podcast (see note)
#                estimate  = my estimate from the surrounding towns; please check
#   approximate: true = the map draws it as "approximate area", not an exact point
#   note:      why a position is uncertain
#   city:      true = a major city today; drawn with a larger marker so small towns and
#              battle sites never look as big as cities
#   reference: true = shown faintly on every map (when in view) so readers can see where
#              a close-up sits in the country. Reference cities are today's cities, for
#              orientation only; they say nothing about the history.
#
# Positions are geography, not history: they are not facts from the podcast and are
# not tagged with fact codes. Everything a map says ABOUT a place lives in maps.yml.

